name: Mise à jour des actus esport

on:
  schedule:
    # S'exécute automatiquement toutes les heures à la minute 00
    - cron: '0 * * * *'
  workflow_dispatch: # Permet aussi de le lancer manuellement

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Exécuter le scraper
        run: python scraper.py

      - name: Sauvegarder les nouvelles actualités
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update actus esport [skip ci]" && git push)
