name: Mise à jour des actus esport

on:
  schedule:
    - cron: '0 * * * *' # Tourne automatiquement toutes les heures
  workflow_dispatch:      # Permet de le lancer à la main avec le bouton

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lancer le scraper avec l'IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py

      - name: Sauvegarder et publier les nouvelles données
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Mise à jour des actus avec classification IA" || exit 0
          git push
