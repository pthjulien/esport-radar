name: Mise à jour des actus esport

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures, à la minute 17 (UTC)
  workflow_dispatch:        # lancement manuel depuis l'onglet Actions

permissions:
  contents: write           # nécessaire pour pousser data.json

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Télécharger et analyser le flux
        run: python scraper.py

      - name: Enregistrer data.json s'il a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Aucun nouvel article, rien à enregistrer."
          else
            git commit -m "Mise à jour des actus esport"
            git push
          fi
