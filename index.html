<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esport Transfer & News Radar</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{font-family:"DM Sans",system-ui,sans-serif;background:#0b0f19;background-image:radial-gradient(800px 400px at 15% -10%,rgba(139,92,246,.18),transparent),radial-gradient(700px 400px at 100% 0,rgba(34,211,238,.12),transparent);background-attachment:fixed}
.fh{font-family:"Chakra Petch","DM Sans",sans-serif}
.card{background:#121829;border:1px solid #1e2740;border-left:4px solid var(--g);border-radius:16px;transition:box-shadow .25s,transform .25s;animation:up .35s both}
.card:hover{box-shadow:0 0 0 1px var(--g),0 10px 30px -12px var(--g);transform:translateY(-2px)}
.panel{background:#121829;border:1px solid #1e2740;border-radius:16px}
.chip{border:1px solid #243049;background:#0f1525;border-radius:999px;padding:6px 14px;font-size:14px;color:#a8b3cf;transition:.2s;white-space:nowrap}
.chip:hover{border-color:#8b5cf6;color:#fff}
.chip[aria-pressed=true]{background:linear-gradient(90deg,#7c3aed,#06b6d4);border-color:transparent;color:#fff}
.bdg{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;letter-spacing:.02em;border:1px solid}
.live{animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.3}}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
:focus-visible{outline:2px solid #22d3ee;outline-offset:2px}
</style>
</head>
<body class="text-slate-200 min-h-screen">
<header class="sticky top-0 z-30 backdrop-blur bg-[#0b0f19]/85 border-b border-[#1e2740]">
  <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-satellite-dish text-cyan-400 text-xl"></i>
      <h1 class="fh text-2xl font-bold tracking-wider text-white">ESPORT <span class="text-violet-400">RADAR</span></h1>
      <span class="bdg bg-emerald-500/15 text-emerald-400 border-emerald-500/40 flex items-center gap-1.5"><span class="live w-2 h-2 rounded-full bg-emerald-400"></span>LIVE</span>
    </div>
    <div class="relative flex-1 min-w-[200px] md:max-w-md md:mx-auto">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
      <input id="q" type="search" aria-label="Rechercher" placeholder="Joueur, équipe, mot-clé..." class="w-full rounded-xl bg-[#0f1525] border border-[#243049] pl-9 pr-3 py-2 placeholder-slate-500 focus:border-violet-500 outline-none">
    </div>
    <div class="flex items-center gap-3 ml-auto">
      <label class="flex items-center gap-2 text-sm cursor-pointer select-none">
        <input id="auto" type="checkbox" checked class="sr-only peer">
        <span class="w-10 h-6 rounded-full bg-slate-700 peer-checked:bg-emerald-500 relative transition after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-5 after:h-5 after:rounded-full after:bg-white after:transition peer-checked:after:translate-x-4 peer-focus-visible:ring-2 peer-focus-visible:ring-cyan-400"></span>
        <span>Auto 10 min <span id="cdn" class="text-slate-500"></span></span>
      </label>
      <button id="rf" class="rounded-xl px-4 py-2 font-semibold text-white bg-gradient-to-r from-violet-600 to-cyan-500 hover:brightness-110 flex items-center gap-2"><i id="sp" class="fa-solid fa-rotate"></i>Actualiser</button>
    </div>
  </div>
  <div class="max-w-7xl mx-auto px-4 pb-2 text-xs text-slate-500 flex flex-wrap gap-x-4"><span id="sync">Dernière synchro : en attente…</span><span id="mode"></span></div>
</header>

<main class="max-w-7xl mx-auto px-4 py-5">
  <div class="flex flex-wrap gap-2 mb-3" id="gf" role="group" aria-label="Filtrer par jeu"></div>
  <div class="flex flex-wrap gap-2 mb-5" id="tf" role="group" aria-label="Filtrer par type d'info"></div>
  <div class="grid lg:grid-cols-12 gap-6">
    <section class="lg:col-span-8">
      <div class="flex items-center justify-between mb-3"><h2 class="fh text-lg text-white">Le flux</h2><span id="cnt" class="text-sm text-slate-500"></span></div>
      <div id="feed" aria-live="polite"></div>
    </section>
    <aside class="lg:col-span-4 space-y-6">
      <div class="panel p-4">
        <h2 class="fh text-lg text-white mb-3"><i class="fa-solid fa-fire text-orange-400 mr-2"></i>Top mouvements mercato</h2>
        <table class="w-full text-sm"><tbody id="top"></tbody></table>
      </div>
      <div class="panel p-4">
        <h2 class="fh text-lg text-white mb-2"><i class="fa-solid fa-bolt text-yellow-300 mr-2"></i>Tournois & Grands chocs</h2>
        <div id="nx"></div>
      </div>
    </aside>
  </div>
  <p class="text-xs text-slate-600 mt-8">Articles synchronisés automatiquement toutes les heures par GitHub Actions depuis Google Actualités.</p>
</main>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 hidden rounded-xl bg-[#1b2440] border border-violet-500/50 px-4 py-2 text-sm shadow-xl" role="status"></div>

<script>
const G={
  lol:{n:'League of Legends',s:'LoL',c:'#c8aa6e'},
  val:{n:'Valorant',s:'Valorant',c:'#ff4655'},
  cs2:{n:'CS2',s:'CS2',c:'#f59e0b'},
  rl:{n:'Rocket League',s:'Rocket League',c:'#38bdf8'},
  dota:{n:'Dota 2',s:'Dota 2',c:'#a78bfa'},
  other:{n:'Esport',s:'Esport',c:'#94a3b8'}
};
const TYPES={all:'Tous',official:'Transfert officiel',rumor:'Rumeur mercato',tournament:'Tournoi',patch:'Patch',news:'Actu générale'};
const BD={
  official:['OFFICIEL','bg-emerald-500/15 text-emerald-300 border-emerald-500/40'],
  rumor:['RUMEUR','bg-amber-500/15 text-amber-300 border-amber-500/40'],
  tournament:['TOURNOI','bg-yellow-500/15 text-yellow-300 border-yellow-500/40'],
  patch:['PATCH','bg-sky-500/15 text-sky-300 border-sky-500/40'],
  news:['ACTU','bg-violet-500/15 text-violet-300 border-violet-500/40']
};

const EVERY=10*60*1000;
const S={items:[],g:'all',t:'all',q:'',busy:false,last:Date.now(),sync:0,loaded:false,mode:'Chargement des données…'};
const \$=id=>document.getElementById(id), p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function when(ts){
  const now=Date.now(),t=new Date(ts).getTime(),m=(now-t)/6e4,h=m/60,d=h/24;
  if(isNaN(t))return"Récemment";
  if(m<1)return"À l'instant";
  if(m<60)return`Il y a ${Math.floor(m)} min`;
  if(h<24)return`Il y a ${Math.floor(h)} h`;
  if(d<2)return"Hier";
  return`Il y a ${Math.floor(d)} jours`;
}

const gb=(g,short)=>{const x=G[g]||G.other;return`<span class="bdg" style="color:${x.c};border-color:${x.c}55;background:${x.c}1f">${esc(short?x.s:x.n)}</span>`};
function sb(ty){
  const b=BD[ty]||BD.news;
  return`<span class="bdg ${b[1]}">${b[0]}</span>`;
}

function card(i,k){
  const c=(G[i.game]||G.other).c;
  const link=/^https?:\/\//.test(i.url||'')?`<a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer" class="text-sm font-semibold text-violet-300 hover:text-cyan-300">Lire l'article <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-1"></i></a>`:'';
  const also=Array.isArray(i.also)&&i.also.length?`<p class="text-xs text-slate-500 mt-2">Aussi relayé par : ${esc(i.also.join(', '))}</p>`:'';
  return`<article class="card p-5 mb-4" style="--g:${c};animation-delay:${Math.min(k,12)*30}ms">
    <div class="flex flex-wrap items-center gap-2 mb-2">${gb(i.game)}${sb(i.category)}<span class="text-xs text-slate-500 ml-auto"><i class="fa-regular fa-clock mr-1"></i>${esc(when(i.published))}</span></div>
    <h3 class="text-lg font-bold text-white leading-snug">${esc(i.title)}</h3>
    ${also}
    <div class="flex items-center justify-between mt-3 gap-3">
      <span class="text-sm text-slate-400 min-w-0 truncate"><i class="fa-regular fa-newspaper mr-1.5 text-cyan-400"></i>${esc(i.source)}</span>
      ${link}
    </div></article>`;
}

const msg=(icon,t,sub)=>`<div class="panel p-8 text-center text-slate-400"><i class="fa-solid ${icon} text-3xl mb-3 block"></i><p class="text-white font-semibold">${esc(t)}</p>${sub?`<p class="text-sm mt-1">\${esc(sub)}</p>`:''}</div>`;

function vis(){
  const q=S.q.toLowerCase();
  return S.items.filter(i=>(S.g==='all'||i.game===S.g)&&(S.t==='all'||i.category===S.t)&&(!q||[i.title,i.source,(G[i.game]||G.other).n].join(' ').toLowerCase().includes(q)));
}

function side(){
  const mv=S.items.filter(i=>i.category==='official'||i.category==='rumor').slice(0,5);
  \$('top').innerHTML=mv.length?mv.map(i=>`<tr class="border-t border-[#1e2740] first:border-0"><td class="py-2 pr-2"><a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer" class="font-semibold text-white hover:text-cyan-300 leading-snug block">${esc(i.title)}</a><div class="text-xs text-slate-500 mt-0.5">${esc(i.source)} · ${esc(when(i.published))}</div></td><td class="py-2 text-right align-top">${gb(i.game,true)}</td></tr>`).join(''):`<tr><td class="text-slate-500 py-2">Aucun transfert récent détecté.</td></tr>`;
  
  const ch=S.items.filter(i=>i.category==='tournament').slice(0,4);
  \$('nx').innerHTML=ch.length?ch.map(i=>`<div class="py-3 border-t border-[#1e2740] first:border-0"><div class="flex justify-between items-start gap-2"><a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer" class="font-semibold text-white hover:text-cyan-300 leading-snug">${esc(i.title)}</a>${gb(i.game,true)}</div><div class="mt-1 text-xs text-slate-500"><i class="fa-regular fa-clock text-cyan-400 mr-1"></i>${esc(when(i.published))} · ${esc(i.source)}</div></div>`).join(''):`<p class="text-sm text-slate-500">Aucun tournoi détecté pour l'instant.</p>`;
}

function render(){
  const v=vis();
  \$('cnt').textContent=`${v.length} info${v.length>1?'s':''}`;
  let h='';
  if(v.length)h+=v.map(card).join('');
  else if(!S.loaded)h+=msg('fa-satellite-dish fa-beat','Chargement des actus…');
  else if(!S.items.length)h+=msg('fa-circle-info text-cyan-400','Aucune actualité disponible','Le fichier data.json est encore vide. Lance le workflow GitHub Actions pour faire le premier chargement !');
  else h+=msg('fa-face-meh','Aucun article ne correspond','Change de filtre ou vide la recherche.');
  \$('feed').innerHTML=h;
  side();
}

function chips(){
  \$('gf').innerHTML=[['all','Tous les jeux'],...Object.entries(G).filter(([k])=>k!=='other').map(([k,v])=>[k,v.n])].map(([k,n])=>`<button class="chip" data-g="${k}" aria-pressed="${S.g===k}">${k!=='all'?`<span class="inline-block w-2 h-2 rounded-full mr-2" style="background:\${G[k].c}"></span>`:''}${esc(n)}</button>`).join('');
  \$('tf').innerHTML=Object.entries(TYPES).map(([k,n])=>`<button class="chip" data-t="${k}" aria-pressed="${S.t===k}">${esc(n)}</button>`).join('');
}

function toast(m){const t=\$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hidden'),3000)}

async function loadData(){
  if(S.busy)return;
  S.busy=true;S.last=Date.now();\$('sp').classList.add('fa-spin');
  try{
    const r=await fetch('./data.json?t='+Date.now());
    if(!r.ok)throw new Error('Erreur HTTP '+r.status);
    const data=await r.json();
    S.items=Array.isArray(data)?data:[];
    S.loaded=true;
    S.sync=Date.now();
    S.mode=`En ligne · ${S.items.length} articles disponibles`;
    toast('Données actualisées');
  }catch(e){
    S.loaded=true;
    S.mode="Erreur de lecture de data.json";
    toast('Erreur de synchronisation');
  }finally{
    S.busy=false;\$('sp').classList.remove('fa-spin');render();
  }
}

$('gf').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(b){S.g=b.dataset.g;chips();render()}});$('tf').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){S.t=b.dataset.t;chips();render()}});
$('q').addEventListener('input',e=>{S.q=e.target.value.trim();render()});$('rf').addEventListener('click',loadData);

setInterval(()=>{
  const s=Math.floor((Date.now()-S.sync)/1000);
  \$('sync').textContent=S.sync?'Dernière synchro : '+(s<60?`il y a ${s} sec`:`il y a ${Math.floor(s/60)} min`):'Dernière synchro : en attente…';
  \$('mode').textContent=S.mode;
  const left=Math.max(0,Math.ceil((EVERY-(Date.now()-S.last))/1000));
  $('cdn').textContent=$('auto').checked?`(${Math.floor(left/60)}:${p2(left%60)})`:'';
  if(\$('auto').checked&&Date.now()-S.last>=EVERY)loadData();
},1000);

chips();render();loadData();
</script>
</body>
</html>
